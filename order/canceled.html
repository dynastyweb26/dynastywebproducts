<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout Canceled — Dynasty Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15140F;
    --ink-soft:#211F18;
    --cream:#F3EEE3;
    --cream-dim:#D8D1C1;
    --amber:#D9A441;
    --amber-bright:#F2C265;
    --ember:#B5511F;
    --line:rgba(243,238,227,0.12);
    --radius:2px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink); color:var(--cream);
    font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
  }
  a{color:inherit;}
  header{border-bottom:1px solid var(--line);}
  .nav{max-width:1180px; margin:0 auto; padding:18px 28px;}
  .brand{
    font-family:'Fraunces',serif; font-size:1.3rem; letter-spacing:0.02em;
    display:flex; align-items:center; gap:10px;
  }
  .brand .dot{width:8px; height:8px; border-radius:50%; background:var(--amber-bright); box-shadow:0 0 10px 3px rgba(242,194,101,0.6);}
  main{flex:1; display:flex; align-items:center; justify-content:center; padding:60px 24px;}
  .panel{
    max-width:520px; width:100%; text-align:center;
    background:var(--ink-soft); border:1px solid var(--line);
    border-radius:var(--radius); padding:48px 34px;
  }
  .eyebrow{
    font-size:0.8rem; text-transform:uppercase; letter-spacing:0.18em;
    color:var(--amber-bright); font-weight:600; margin-bottom:18px;
  }
  h1{font-family:'Fraunces',serif; font-weight:500; font-size:2rem; margin-bottom:18px; color:var(--cream);}
  p{color:var(--cream-dim); line-height:1.6; font-size:1rem; margin-bottom:24px;}
  .back{
    display:inline-flex; align-items:center; gap:10px;
    background:var(--amber-bright); color:var(--ink);
    padding:13px 26px; border-radius:var(--radius);
    font-weight:600; text-decoration:none; font-size:0.92rem;
    transition:transform .2s, box-shadow .2s;
  }
  .back:hover{transform:translateY(-2px); box-shadow:0 8px 24px rgba(242,194,101,0.25);}
</style>
</head>
<body>
<header>
  <div class="nav">
    <a href="/" class="brand"><span class="dot"></span>Dynasty Web</a>
  </div>
</header>
<main>
  <div class="panel">
    <div class="eyebrow">Checkout canceled</div>
    <h1>Nothing was charged.</h1>
    <p>Your card was not charged and no order was placed. Pick up where you left off whenever you are ready.</p>
    <a href="/#catalog" class="back">Back to the catalog</a>
  </div>
</main>
</body>
</html>
